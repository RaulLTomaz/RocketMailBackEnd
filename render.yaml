services:
  - type: web
    name: rocketmail-api
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "1"
      - key: PUBLIC_BASE_URL
        value: https://rocketmail-api.onrender.com
      # Frontend na Vercel (produção + previews *.vercel.app via regex no código).
      - key: ALLOWED_ORIGINS
        value: "https://rocket-mail-site.vercel.app,http://localhost:8081,http://localhost:3000"
      - key: ALLOWED_ORIGIN_REGEX
        value: "https://([\\w-]+\\.)*vercel\\.app"
      # Obrigatório para fotos persistirem (disco do Render é efêmero).
      # No dashboard do Render: Environment → CLOUDINARY_URL =
      # cloudinary://<API_KEY>:<API_SECRET>@<CLOUD_NAME>
      - key: CLOUDINARY_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rocketmail-db
          property: connectionString

databases:
  - name: rocketmail-db
    plan: free
    region: oregon
